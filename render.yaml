services:
  - type: web
    name: clincyanywhere-demo-api
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/Ketantalele5/clincanywhere-demo-deploy
    branch: main
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: CORS_ALLOWED_ORIGINS
        value: https://clincyanywhere-preview.pages.dev
      - key: DEMO_JWT_SECRET
        generateValue: true
