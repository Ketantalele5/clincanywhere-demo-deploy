[SERVICE]
    Flush        5
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              /var/log/clincanywhere/*.log
    Tag               clincanywhere.app
    Parser            json
    DB                /tmp/flb_clincanywhere.db
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On

[OUTPUT]
    Name              splunk
    Match             clincanywhere.*
    Host              ${SPLUNK_HEC_HOST}
    Port              ${SPLUNK_HEC_PORT}
    Splunk_Token       ${SPLUNK_HEC_TOKEN}
    TLS               On
    TLS.Verify        On
    Splunk_Send_Raw   Off
