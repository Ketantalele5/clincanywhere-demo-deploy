# This file is included inside nginx http{} context.
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=public_per_ip:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
resolver 127.0.0.11 valid=10s ipv6=off;
upstream api_backend {
    zone api_backend 64k;
    server api:8080 resolve max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 1m;
    limit_conn connections_per_ip 200;

    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=auth_per_ip burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/public/clinic-onboarding {
        limit_req zone=public_per_ip burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /ws {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
    location ~ ^/api/[^/]+/notifications/stream$ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
    location / {
        limit_req zone=api_per_ip burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
