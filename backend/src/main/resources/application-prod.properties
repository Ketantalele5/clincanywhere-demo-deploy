spring.jpa.show-sql=false
server.address=${SERVER_ADDRESS:0.0.0.0}
spring.h2.console.enabled=false
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.jwt.secret=${JWT_SECRET}
app.data-encryption.key=${APP_DATA_ENCRYPTION_KEY}
app.phone-fingerprint.key=${APP_PHONE_FINGERPRINT_KEY}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
app.whatsapp.enabled=${WHATSAPP_ENABLED:false}
app.whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
app.whatsapp.webhook-verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
app.whatsapp.clinic-id=${WHATSAPP_CLINIC_ID:}
app.realtime.relay.host=${STOMP_RELAY_HOST:}
app.realtime.relay.port=${STOMP_RELAY_PORT:61613}
app.realtime.relay.login=${STOMP_RELAY_LOGIN:}
app.realtime.relay.passcode=${STOMP_RELAY_PASSCODE:}
logging.level.root=INFO
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
logging.structured.format.console=${LOG_FORMAT:logstash}
management.server.port=${MANAGEMENT_SERVER_PORT:8081}
app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.platform-owner.enabled=${BOOTSTRAP_PLATFORM_OWNER_ENABLED:false}
app.bootstrap.platform-owner.username=${BOOTSTRAP_PLATFORM_OWNER_USERNAME:}
app.bootstrap.platform-owner.password=${BOOTSTRAP_PLATFORM_OWNER_PASSWORD:}
app.production.release-approved=${PRODUCTION_RELEASE_GATES_APPROVED:false}
app.production.evidence-reference=${PRODUCTION_RELEASE_EVIDENCE_REF:}

