spring.application.name=clincanywhere-api
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.profiles.default=dev
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.transaction.default-timeout=30s
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/clincanywhere;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.h2.console.enabled=false
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.prometheus.access=read-only
management.endpoint.metrics.access=read-only
management.endpoint.info.access=read-only
management.metrics.tags.application=${spring.application.name}
server.tomcat.connection-timeout=5s
spring.mvc.async.request-timeout=30s
spring.task.execution.pool.core-size=${ASYNC_CORE_POOL_SIZE:4}
spring.task.execution.pool.max-size=${ASYNC_MAX_POOL_SIZE:16}
spring.task.execution.pool.queue-capacity=${ASYNC_QUEUE_CAPACITY:200}
spring.task.execution.thread-name-prefix=clincanywhere-async-
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=60s
logging.level.root=INFO
logging.level.com.clincanywhere=INFO
logging.file.name=${LOG_FILE:./logs/clincanywhere.log}
logging.structured.format.file=${LOG_FORMAT:logstash}
management.endpoint.health.show-details=when_authorized
management.prometheus.metrics.export.enabled=true
server.tomcat.threads.max=${SERVER_MAX_THREADS:200}
app.whatsapp.enabled=${WHATSAPP_ENABLED:false}
app.whatsapp.api-url=${WHATSAPP_API_URL:https://graph.facebook.com/v23.0}
app.whatsapp.api-token=${WHATSAPP_API_TOKEN:}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.payments.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.payments.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.payments.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
app.abdm.enabled=${ABDM_ENABLED:false}
app.abdm.base-url=${ABDM_BASE_URL:}
app.abdm.hip-id=${ABDM_HIP_ID:}
app.abdm.client-id=${ABDM_CLIENT_ID:}
app.abdm.client-secret=${ABDM_CLIENT_SECRET:}
app.abdm.mode=${ABDM_MODE:SANDBOX}
app.notifications.provider-enabled=${NOTIFICATIONS_PROVIDER_ENABLED:false}
app.notifications.endpoint=${NOTIFICATIONS_API_URL:}
app.notifications.api-token=${NOTIFICATIONS_API_TOKEN:}
app.notifications.sms-sender=${NOTIFICATIONS_SMS_SENDER:}
app.notifications.email-sender=${NOTIFICATIONS_EMAIL_SENDER:}
management.otlp.metrics.export.enabled=${OTEL_METRICS_ENABLED:false}
management.otlp.metrics.export.url=${OTEL_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
management.otlp.tracing.endpoint=${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

