services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: carepilot
      POSTGRES_USER: carepilot
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carepilot -d carepilot"]
      interval: 5s
      timeout: 3s
      retries: 15
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    command: ["sh", "-c", "rabbitmq-plugins enable --offline rabbitmq_stomp && exec rabbitmq-server"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build: ./backend
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:postgresql://postgres:5432/carepilot
      DB_USERNAME: carepilot
      DB_DRIVER: org.postgresql.Driver
      OTEL_METRICS_ENABLED: "true"
      OTEL_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      OTEL_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      STOMP_RELAY_HOST: rabbitmq
      STOMP_RELAY_PORT: 61613
      STOMP_RELAY_LOGIN: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      STOMP_RELAY_PASSCODE: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
      APP_REALTIME_SHARED_EVENTS_ENABLED: "true"
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-12}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    volumes:
      - clincanywhere-logs:/var/log/clincanywhere
    restart: unless-stopped
  edge:
    image: nginx:1.29.1-alpine
    ports: ["8080:8080"]
    volumes: ["./ops/nginx-rate-limit.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on: [api]
  grafana:
    image: grafana/grafana:12.1.1
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./ops/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]
  splunk-forwarder:
    image: fluent/fluent-bit:3.2.10
    profiles: ["splunk"]
    command: ["-c", "/fluent-bit/etc/clincanywhere.conf"]
    environment:
      SPLUNK_HEC_HOST: ${SPLUNK_HEC_HOST:?Set SPLUNK_HEC_HOST when using --profile splunk}
      SPLUNK_HEC_PORT: ${SPLUNK_HEC_PORT:-8088}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:?Set SPLUNK_HEC_TOKEN when using --profile splunk}
    volumes:
      - clincanywhere-logs:/var/log/clincanywhere:ro
      - ./ops/splunk-hec-fluent-bit.conf:/fluent-bit/etc/clincanywhere.conf:ro
    depends_on: [api]
volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
  clincanywhere-logs:
